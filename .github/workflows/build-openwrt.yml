name: Build fanchmWrt (x86/64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev libelf-dev libudev-dev libpcap-dev libcap-dev python3 python3-pip python3-setuptools python3-yaml rsync swig unzip zlib1g-dev file wget curl libtool bzip2

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply target config
        run: |
          cp .config.build .config
          make defconfig

      - name: Compile firmware
        run: |
          make -j$(nproc) V=s 2>&1 | tee build.log

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-x86-64
          path: |
            bin/targets/x86/64/
            build.log
          retention-days: 14
