name: Build fanchmWrt (x86/64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm flex bison gcc g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev libelf-dev libudev-dev libpcap-dev libcap-dev python3 python3-pip python3-setuptools python3-yaml rsync swig unzip zlib1g-dev file wget curl libtool bzip2 dwarves pkg-config cmake zstd libclang-dev libbpf-dev

      - name: Install Rust toolchain and bpf-linker (needed by honk)
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup toolchain install 1.99.1 --profile minimal --target x86_64-unknown-linux-musl
          rustup toolchain install nightly-2026-10-20 --profile minimal --component rust-src,llvm-tools
          rustup target add --toolchain nightly-2026-10-20 bpfel-unknown-none
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bpf-linker.tar.zst" \
            https://github.com/aya-rs/bpf-linker/releases/download/v0.11.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          echo "10f62ba9ab7e544d538370552660efcb4f1a19153d5752bbf0f6b51f3bada450  $RUNNER_TEMP/bpf-linker.tar.zst" | sha256sum -c -
          zstd -dc "$RUNNER_TEMP/bpf-linker.tar.zst" | tar -xf - -C "$HOME/.cargo/bin"
          chmod +x "$HOME/.cargo/bin/bpf-linker"
          "$HOME/.cargo/bin/bpf-linker" --version

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          git clone --branch v0.1.0-beta.1 https://github.com/daeuniverse/honk.git feeds/daeuniverse/honk/src
          ./scripts/feeds install -a

      - name: Apply target config
        run: |
          cp .config.build .config
          make defconfig

      - name: Compile firmware
        run: |
          source "$HOME/.cargo/env"
          export PATH="$HOME/.cargo/bin:$PATH"
          make -j$(nproc) V=s 2>&1 | tee build.log

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-x86-64
          path: |
            bin/targets/x86/64/
            build.log
          retention-days: 14
